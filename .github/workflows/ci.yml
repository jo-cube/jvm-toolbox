name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Verify correctness, Javadocs, and source sets
        run: ./gradlew check --warning-mode=fail
      - name: Verify publication metadata and artifacts
        run: ./gradlew assemble generatePomFileForMavenJavaPublication generateMetadataFileForMavenJavaPublication --warning-mode=fail
